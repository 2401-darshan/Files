<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    
    <h1>Student Registration</h1>
    <form>
        <table>
            <tr>
                <td><label for="Fullname">Fullname</label></td>
                <td><input type="text" name="Fullname"></td>
            </tr>
            <tr>
                <td><label for="Email">Email</label></td>
                <td><input type="text" name="Email"></td>
            </tr>
            <tr>
                <td><label for="Mobile No">Mobile No</label></td>
                <td><input type="text" name="Mobile No"></td>
            </tr>
            <tr>
                <td><label for="Address">Address</label></td>
                <td><textarea></textarea></td>
            </tr>
            <tr>
                <td><label for="Nationality">Nationality</label></td>
                <td><input type="text" name="Nationality"></td>
            </tr>
            <tr>
                <td><label for="Date of Birth">Date of Birth</label></td>
                <td><input type="date" name="date"></td>
            </tr>
            <tr>
                <td><label for="Gender">Gender</label></td>
                <td><input type="radio" name="Gender">Male
                <input type="radio" name="Gender">Female</td>
            </tr>
            <tr>
                <td><label for="Highest Degree">Highest Degree</label></td>
                <td>
                    <select id="Degree" name="Degree">
                        <option value="Information Technology">Information Technology</option>
                        <option value="B.com">B.com</option>
                        <option value="B.sc(H)CS">B.sc(H)CS</option>
                        <option value="MBA">MBA</option>
                        <option value="MCA">MCA</option>
                        <option value="B.Tech">B.Tech</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="CPI">CPI</label></td>
                <td><input type="text" name="CPI"></td>
            </tr>
            <tr>
                <td><label for="University">University</label></td>
                <td><input type="text" name="University"></td>
            </tr>
            <tr>
                <td><label for="Passing Year">Passing Year</label></td>
                <td>
                    <select id="Passing Year" name="Passing Year">
                        <option value="2024">2024</option>
                        <option value="2024">2023</option>
                        <option value="2024">2022</option>
                        <option value="2024">2021</option>
                        <option value="2024">2020</option>
                        <option value="2024">2019</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><button>Submit</button></td>
                <td><button>Cancel</button></td>
            </tr>
        </table>
    </form>
    
</body>
</html>
