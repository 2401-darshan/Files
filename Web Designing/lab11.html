<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient</title>
    <style>
        .a {
            width: 200px;
            height: 200px;
            background-image: linear-gradient(green, yellow);
            
        }
        .b {
            width: 200px;
            height: 200px;
            
            background-image: linear-gradient(to right, green,yellow);
        }
        .c {
            width: 200px;
            height: 200px;
            background-image: radial-gradient(green, yellow);
        }
        .d {
            width: 200px;
            height: 200px;
            background-image: radial-gradient(green, yellow,black, blue, pink);
        }
        .e {
            width: 200px;
            height: 200px;
            background-image: conic-gradient(green, yellow, black, blue, pink);
            border-radius: 300px;
        }
    </style>
</head>
<body>
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
    <div class="d"></div>
    <div class="e"></div>
    <div class="f"></div>
</body>
</html>
