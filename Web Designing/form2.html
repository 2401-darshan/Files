<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>COVID-19 Vaccine Registration Form</h1>
    <form>
        <table>
            <tr>
                <td><label for="First Name">First Name:</label></td>
                <td><input type="text" name="First Name"></td>
            </tr>
            <tr>
                <td><label for="Last Name">Last Name:</label></td>
                <td><input type="text" name="Last Name"></td>
            </tr>
            <tr>
                <td><label for="Aadhar Number:">Aadhar Number</label></td>
                <td><input type="text" name="Aadhar Number"></td>
            </tr>
            <tr>
                <td><label for="Vaccine Name">Vaccine Name:</label></td>
                <td>
                    <select id="Vaccine Name" name="Vaccine Name">
                        <option value="" selected disabled>Please select Vaccine Name:</option>
                        <option value="X">X</option>
                        <option value="Y">Y</option>
                        <option value="Z">Z</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="Vaccine Center Name">Vaccine Center Name:</label></td>
                <td>
                    <select id="Vaccine Center Name" name="Vaccine Center Name">
                        <option value="" selected disabled>Please select Vaccine Center Name:</option>
                        <option value="Civil Hospital">Civil Hospital</option>
                        <option value="Masum Hospital">Masum Hospital</option>
                        <option value="Ayush Hospital">Ayush Hospital</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="Date Of Dose">Date Of Dose:</label></td>
                <td><input type="date" name="date"></td>
            </tr>
            <tr>
                <td><label for="Dose Number">Dose Number</label></td>
                <td><input type="text" name="Dose Number"></td>
            </tr>
            <tr>
                <td><button>CLICK HERE</button></td>
                <td><button>CANCEL</button></td>
            </tr>
        </table>
    </form>
</body>
</html>
