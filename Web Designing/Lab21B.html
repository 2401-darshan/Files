<!DOCTYPE html>
<html>

<head>
    <title>Pricing Table</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .pricing {
            max-width: 1040px;
            margin: auto;
        }

        .card {
            background: #f1f1f1;
            border-radius: 0;
            padding: 35px 5px;
        }

        .basic {
            background: #e65376;
            color: white;
            padding: 50px 5px;
        }

        .btn {
            background: #e65376;
            color: white;
            border-radius: 0;
        }

        .basic .btn {
            background: #ffeb3b;
            color: black;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="pricing">
            <h2 class="text-center"><b>Pricing Table</b></h2>
            <p class="text-center mb-4">
                Sample text. Lorem ipsum dolor sit amet, consectetur adipiscing elit nullam nunc justo sagittis suscipit
                ultrices.
            </p>

            <div class="row g-l-5 align-items-center text-center">

                <div class="col-md-3">
                    <div class="card">
                        <h2>Start</h2>
                        <h4>Free</h4>
                        <p>1 User<br>1 User</p>
                        <div class="w-100">
                            <button class="btn">Order Now</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card basic">
                        <h2>Basic</h2>
                        <h4>$19.99</h4>
                        <p>5 Users<br>5 Projects</p>
                        <div class="w-100">
                            <button class="btn">Order Now</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card">
                        <h2>Medium</h2>
                        <h4>$49.99</h4>
                        <p>100 Users<br>100 Projects</p>
                        <div class="w-100">
                            <button class="btn">Order Now</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card">
                        <h2>Expet</h2>
                        <h4>$199.99</h4>
                        <p>Unlimited Users<br>Unlimited Projects</p>
                        <div class="w-100">
                            <button class="btn">Order Now</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
