<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <h1 class="mt-3 ms-3">Complex Bootstrap Form</h1>

    <form class="ms-3 me-3">
        <div class="row">
            <div class="col">
                <label for="name" class="form-label">First Name</label>
                <input type="text" class="form-control" placeholder="Enter Your First Name">
            </div>
            <div class="col">
                <label for="name" class="form-label">Last Name</label>
                <input type="text" class="form-control" placeholder="Enter Your Last Name">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label for="email" class="form-label">Email</label>
                <input type="text" class="form-control" placeholder="Enter Your Email">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label for="password" class="form-label">Password</label>
                <input type="text" class="form-control" placeholder="Enter Your Password">
            </div>
            <div class="col">
                <label for="email" class="form-label">Confirm Password</label>
                <input type="text" class="form-control" placeholder="Confirm Your Password">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" placeholder="1234 Main St">
            </div>
        </div>

        <div class="row">
            <div class="col-7">
                <label for="city" class="form-label">City</label>
                <input type="text" class="form-control">
            </div>
            <div class="col-3">
                <label for="state" class="form-label">State</label>
                
                <select name="state" class="form-select">
                    <option value="">Choose...</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Rajasthan">Rajasthan</option>
                    <option value="Punjab">Punjab</option>
                </select>
            </div>

            <div class="col-2">
                <label for="Zip" class="form-label">Zip</label>
                <input type="text" class="form-control">
            </div>

            <div class="row">
                <div class="col mt-3">
                    <input type="checkbox" class="form-check-input">
                    <label for="check me out">Check me out
                </div>
            </div>

            <div>
                <button class="btn btn-outline-success text-bg-primary mt-3" type="submit">Sign Up</button>
            </div>
        </div>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
