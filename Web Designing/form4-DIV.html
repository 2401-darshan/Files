<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


</head>
<body>
    <h1 style="text-align: center;">Employee Registration</h1>
    <h3 style="text-align: center;">Personal Information</h3>
<div class="form-container">

    <div class="form">
        <form>
            <div class="form-group">
                <label for="Employee ID">Employee ID:</label>
                <input type="text" name="Employee Id">
                <label for=""></label>
                <label for="Employee Name">Employee Name:</label>
                <input type="text" name="Employee Name">
            </div>
            <div class="form-group">
                <label for="Email">Email:</label>
                <input type="text" name="Email">
                <label for=""></label>
                <label for="Contact No">Contact No:</label>
                <input type="number" name="Contact No">
            </div>
            <div class="form-group">
                <label for="Marital Status">Marital Status:</label>
                <input type="radio" name="Marital Status">Single
                <input type="radio" name="Marital Status">Married
            </div>
    
            <h2 style="text-align: center;">Education Qualification</h2>
            <div class="form-group">
                <label for="Education">Education:</label>
                <input type="text" name="Education"> 
                <label for=""></label>
                <label for="Experience">Experience:</label>
                <input type="text" name="Experience">
            </div>
    
            <h3 style="text-align: center;">Job Details</h3>
    
            <div class="form-group">
                <label for="Designation">Designation:</label>
                <input type="text" name="Designation">
                <label for=""></label>
                <label for="Job Location">Job Location:</label>
                <input type="text" name="Job Location">
            </div>
            <div class="form-group">
                <label for="Salary">Salary:</label>
                <input type="number" name="Salary">
            </div>
    
    
            <hr>
    
            <div class="form-group">
                <input type="submit" value="Register">
            </div>
        </form>
    </div>
</div>      
</body>
</html>
