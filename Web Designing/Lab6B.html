<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .header{
            background-color: red;
            color: white;
            height: 5vh;
            width: 65vh;
            text-align: center;
            padding-top: 15px;
            margin-bottom: 5px;
        }
        .navigation{
            background-color: purple;
            color: white;
            width: 35%;
            height: 40vh;
            float: left;
            text-align: center;
        }
        .content{
            background-color: yellow;
            color: black;
            width: 65%;
            height: 40vh;
            float: right;
            padding-left: 5px;

        }
        .sidebar{
            background-color: green;
            color: white;
            float: right;
            width: 25%;
            height: 60%;
            margin-left: 10px;
        }
        .footer{
            background-color: lightblue;
            color: white;
            width: 475px;
            height: 5vh;
        }
    </style>
</head>
<body>
    <div class="container">
        
       <div class="header">header</div>

       <div class="navigation">navigation
            <div class="content">Content
                <div class="sidebar">sidebar</div>
            </div>
       </div>

       <div class="footer">footer</div>

    </div>
</body>
</html>
